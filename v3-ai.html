<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe v3 (AI + Extras)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <div class="page-actions">
      <a href="index.html"><button>← Back to versions</button></a>
      <label>Mode:
        <select id="mode">
          <option value="pvp">Player vs Player</option>
          <option value="cpu-random">Vs CPU (Random)</option>
          <option value="cpu-hard">Vs CPU (Hard)</option>
        </select>
      </label>
      <button id="undo">Undo</button>
      <button id="theme">Toggle theme</button>
      <button id="restart" class="primary">Restart</button>
    </div>

    <h1>Version 3: AI, Theme Toggle, and Undo</h1>
    <p id="status">Current turn: X</p>
    <div class="board" id="board"></div>
  </main>
  <script src="v3-ai.js"></script>
</body>
</html>
