<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe v2</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>Tic Tac Toe v2</h1>
    <p id="status">Turn: X</p>

    <section class="scoreboard" aria-label="Scoreboard">
      <div>X: <span id="score-x">0</span></div>
      <div>O: <span id="score-o">0</span></div>
      <div>Draws: <span id="score-draw">0</span></div>
    </section>

    <div id="board" class="board" aria-label="Tic Tac Toe board"></div>

    <div class="actions">
      <button id="next-round">Next round</button>
      <button id="full-reset">Reset match</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
